# listing.toml: hello-invoice's page in the eBillAddress Marketplace. It is an example: list your own app, not this one.

name = "Hello Invoice"
tagline = "Send your first invoice through the eBillAddress API"
category = "billing"
keywords = ["invoices", "example"]
description = """
An example app. It sends a one-line invoice from your organisation to any eBillAddress address, and logs when it
is delivered.

**What it needs:** to write a draft, send it, and see what happened to it.
"""
release_notes = "First release."

