# hello-invoice: hear when an invoice arrives, and read it.
# Check it with `ebill app validate`. Contract: https://github.com/openbtps/ebill-dev-kit/blob/main/CONTRACT.md

[app]
# Issued when you register the app in the developer portal. Replace this placeholder with yours.
client_id = "app_000000000000000000000000"
handle = "hello-invoice"
kind = "integration"
version = "1.0.0"

[auth]
# For `ebill app dev`, eBill sends the browser back here after the install. Add your deployed address before you release.
redirect_urls = ["https://localhost:3000/auth/callback"]

[access]
# Read the documents the organisation receives: the one scope that does that.
scopes = ["documents:received:read"]

[webhooks]
api_version = "2026-12"
# eBill's webhooks need an https address it can reach: during `ebill app dev`, a tunnel to localhost:3000.
url = "https://example.com/webhooks"
topics = ["document.received", "app.uninstalled"]

[sync]
browser = false

[pricing]
model = "free"
